<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Files - ShareAagan</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../public/css/style.css">

</head>

<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo">
      ShareAagan
    </div>

    <nav class="nav-links">
      <a href="/index.html">
        Home
      </a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section class="card files-card">
      <div class="files-header">
        <div>
          <h1>
            My Files
          </h1>

          <p>
            View files you have received and sent.
          </p>
        </div>
      </div>

      <!-- ============================= -->
      <!-- RECEIVED FILES -->
      <!-- ============================= -->

      <div class="files-section">
        <h2>
          Received Files
        </h2>

        <div id="receivedFiles">
          <p class="loading-message">
            Loading received files...
          </p>
        </div>
      </div>

      <!-- ============================= -->
      <!-- SENT FILES -->
      <!-- ============================= -->

      <div class="files-section">
        <h2>
          Sent Files
        </h2>

        <div id="sentFiles">
          <p class="loading-message">
            Loading sent files...
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>
      &copy; 2026 ShareAagan. All rights reserved.
    </p>
  </footer>

  <!-- Files JavaScript -->
  <script src="../public/js/files.js"></script>

  <!-- Authentication JavaScript -->
  <script src="../public/js/auth.js"></script>
</body>

</html>
