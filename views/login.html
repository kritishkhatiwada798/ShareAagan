<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login / Register - ShareAagan</title>

    <!-- CSS -->

    <link rel="stylesheet" href="../public/css/style.css">

</head>

<body>

    <!-- Header -->
    <header>
        <nav class="navbar">
            <a href="/" class="logo">ShareAagan</a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/send.html">Send File</a>
                <a href="/files.html">Files</a>
                <div class="profile-container" id="profileContainer">

                    <a href="/login.html" id="authLink">
                        Login
                    </a>

                </div>
            </div>
        </nav>
    </header>

    <!-- Account forms -->
    <main>
        <section class="card">

            <h1 id="formTitle">Welcome Back!</h1>

            <!-- Login and Register tabs -->
            <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                <button type="button" id="loginTab" class="btn" style="flex: 1;">
                    Login
                </button>

                <button type="button" id="registerTab" class="btn btn-secondary" style="flex: 1;">
                    Register
                </button>
            </div>

            <!-- Login form -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <!-- Registration form -->
            <form id="registerForm" hidden>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>

                <button type="submit" class="btn">
                    Create Account
                </button>

            </form>

            <p id="message"></p>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ShareAagan. All rights reserved.</p>
    </footer>

    // Add the login.js script to handle form switching and submission
    <script src="../public/js/login.js"></script>


    // Add the auth.js script to handle authentication and logout functionality
    <script src="../public/js/auth.js"></script>
</body>


</html>
