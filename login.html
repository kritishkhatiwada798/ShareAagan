<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login / Register - ShareAagan</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="navbar">
            <a href="/" class="logo">ShareAagan</a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/send.html">Send File</a>
                <a href="/files.html">Files</a>
                <div class="profile-container" id="profileContainer">

                    <a href="/login.html" id="authLink">
                        Login
                    </a>

                </div>
            </div>
        </nav>
    </header>

    <!-- Account forms -->
    <main>
        <section class="card">

            <h1 id="formTitle">Welcome Back!</h1>

            <!-- Login and Register tabs -->
            <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                <button type="button" id="loginTab" class="btn" style="flex: 1;">
                    Login
                </button>

                <button type="button" id="registerTab" class="btn btn-secondary" style="flex: 1;">
                    Register
                </button>
            </div>

            <!-- Login form -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <!-- Registration form -->
            <form id="registerForm" hidden>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>

                <button type="submit" class="btn">
                    Create Account
                </button>

            </form>

            <p id="message"></p>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ShareAagan. All rights reserved.</p>
    </footer>

    <script>
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");

        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");

        const formTitle = document.getElementById("formTitle");
        const message = document.getElementById("message");

        // Show login form
        loginTab.addEventListener("click", () => {
            loginForm.hidden = false;
            registerForm.hidden = true;

            formTitle.textContent = "Welcome Back!";

            loginTab.className = "btn";
            registerTab.className = "btn btn-secondary";

            message.textContent = "";
        });

        // Show registration form
        registerTab.addEventListener("click", () => {
            loginForm.hidden = true;
            registerForm.hidden = false;

            formTitle.textContent = "Create an Account";

            registerTab.className = "btn";
            loginTab.className = "btn btn-secondary";

            message.textContent = "";
        });

        // Registration form submission
        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const email =
                document.getElementById("registerEmail").value;

            const password =
                document.getElementById("registerPassword").value;

            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                });

                const result = await response.text();

                message.textContent = result;

                if (response.ok) {
                    registerForm.reset();

                    // Switch to login after registration
                    loginTab.click();

                    message.textContent =
                        "Registration successful! You can now log in.";
                }
            } catch {
                message.textContent =
                    "Could not connect to the server.";
            }
        });

        // Login form submission
        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const message = await response.text();

                if (response.ok) {
                    window.location.href = "/index.html";
                } else {
                    const message = await response.text();
                    alert(message);
                }
            } catch (error) {
                console.error(error);
                alert("Could not connect to the server.");
            }
        });
    </script>

    // Add the auth.js script to handle authentication and logout functionality
    <script src="/auth.js"></script>
</body>


</html>
