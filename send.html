<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Send File - ShareAagan</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <!-- Header -->
    <header class="navbar">

        <div class="logo">
            ShareAagan
        </div>

        <nav class="nav-links">

            <a href="/index.html">
                Home
            </a>

            <div class="profile-container" id="profileContainer">

                <a href="/login.html" id="authLink">
                    Login
                </a>

            </div>

        </nav>

    </header>


    <!-- Main Content -->
    <main>

        <section class="card">

            <h1>
                Send a File
            </h1>

            <p>
                Choose a recipient and a file to send.
            </p>


            <form id="sendFileForm">


                <!-- Recipient -->
                <div class="form-group">

                    <label for="recipient">
                        Send To
                    </label>

                    <select id="recipient" name="recipient" required>

                        <option value="">
                            Select a recipient
                        </option>

                    </select>

                </div>


                <!-- File -->
                <div class="form-group">

                    <label for="file">
                        Select File
                    </label>

                    <input type="file" id="file" name="file" required>

                </div>


                <button type="submit" class="btn">

                    Send File

                </button>

            </form>


            <p id="message"></p>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 ShareAagan. All rights reserved.
        </p>

    </footer>


    <script>

        const sendFileForm =
            document.getElementById("sendFileForm");

        const recipientSelect =
            document.getElementById("recipient");

        const message =
            document.getElementById("message");


        // =====================================================
        // LOAD USERS
        // =====================================================

        async function loadUsers() {

            try {

                const response =
                    await fetch("/users", {
                        credentials: "same-origin"
                    });


                if (!response.ok) {

                    message.textContent =
                        "Please log in to send a file.";

                    return;
                }


                const users =
                    await response.json();


                users.forEach(user => {

                    const option =
                        document.createElement("option");

                    option.value = user.id;

                    option.textContent =
                        `${user.username} (${user.email})`;

                    recipientSelect.appendChild(option);

                });

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Could not load users.";

            }

        }


        loadUsers();


        // =====================================================
        // SEND FILE
        // =====================================================

        sendFileForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const fileInput =
                    document.getElementById("file");

                const file =
                    fileInput.files[0];

                const recipientId =
                    recipientSelect.value;


                if (!recipientId) {

                    message.textContent =
                        "Please select a recipient.";

                    return;

                }


                if (!file) {

                    message.textContent =
                        "Please select a file.";

                    return;

                }


                const formData =
                    new FormData();


                formData.append(
                    "file",
                    file
                );


                formData.append(
                    "recipientId",
                    recipientId
                );


                try {

                    const response =
                        await fetch(
                            "/send-file",
                            {
                                method: "POST",
                                credentials: "same-origin",
                                body: formData
                            }
                        );


                    const result =
                        await response.text();


                    message.textContent =
                        result;


                    if (response.ok) {

                        sendFileForm.reset();

                    }

                }

                catch (error) {

                    console.error(error);

                    message.textContent =
                        "Could not connect to the server.";

                }

            }
        );

    </script>


    <!-- Authentication JavaScript -->
    <script src="/auth.js"></script>

</body>

</html>
